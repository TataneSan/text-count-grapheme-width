[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-count-grapheme-width"
version = "1.0.0"
description = "Measure the terminal display width of each line of text (ASCII=1, wide CJK/emoji=2)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
text-count-grapheme-width = "text_count_grapheme_width.cli:main"

[tool.setuptools.packages.find]
include = ["text_count_grapheme_width*"]
