[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text-count-grapheme-width"
version = "1.0.0"
description = "Compute the terminal display width of each line of a text file (ASCII=1, wide CJK/emoji=2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TataneSan" }]
keywords = ["unicode", "width", "terminal", "cjk", "emoji", "cli"]

[project.urls]
Homepage = "https://github.com/TataneSan/text-count-grapheme-width"

[project.scripts]
text-count-grapheme-width = "text_count_grapheme_width.cli:main"

[tool.setuptools.packages.find]
include = ["text_count_grapheme_width*"]
